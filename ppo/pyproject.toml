[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-ppo"
version = "0.2.0"
description = "SO-101 position reaching with mjlab, BAM and RSL-RL PPO"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.3.0",
  "mujoco==3.7.0",
  "mujoco-warp==3.7.0.1",
  "warp-lang==1.12.0",
  "rsl-rl-lib==5.0.1",
  "torch==2.10.0",
  "better-actuator-models",
  "scipy>=1.16",
  "onnxruntime>=1.24",
]

[project.scripts]
so101-train = "so101_ppo.train:main"
so101-eval = "so101_ppo.evaluate:main"
so101-check = "so101_ppo.check:main"
so101-replay = "so101_ppo.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
so101_ppo = ["assets/**/*"]

[dependency-groups]
dev = ["pytest>=9"]

[project.optional-dependencies]
cpu = ["torch==2.10.0", "torchvision==0.25.0"]
cuda = ["torch==2.10.0", "torchvision==0.25.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "620a64fe67c1afe94fca81da73b128c7aed17c5f" }
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" }, { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" }, { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
